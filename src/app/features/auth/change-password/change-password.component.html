<div class="cp-page hau-safe-page">
  <div class="cp-card hau-card">

    <div class="cp-card__icon">
      <ion-icon name="key-outline"></ion-icon>
    </div>

    @if (forced()) {
      <h1 class="cp-card__title">{{ 'auth.changePassword.forcedTitle' | transloco }}</h1>
      <p class="cp-card__subtitle">{{ 'auth.changePassword.forcedSubtitle' | transloco }}</p>
    } @else {
      <h1 class="cp-card__title">{{ 'auth.changePassword.voluntaryTitle' | transloco }}</h1>
    }

    <form class="cp-form" (submit)="submit($event)">
      <app-form-field
        [label]="'auth.changePassword.currentPasswordPlaceholder' | transloco"
        inputId="cp-currentPassword"
        [required]="true"
        [error]="currentPasswordError()">
        <input
          id="cp-currentPassword"
          type="password"
          name="currentPassword"
          autocomplete="current-password"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
        />
      </app-form-field>

      <app-form-field
        [label]="'auth.changePassword.newPasswordPlaceholder' | transloco"
        inputId="cp-newPassword"
        [required]="true"
        [error]="newPasswordError()">
        <input
          id="cp-newPassword"
          type="password"
          name="newPassword"
          autocomplete="new-password"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
        />
      </app-form-field>

      <app-form-field
        [label]="'auth.changePassword.confirmPasswordPlaceholder' | transloco"
        inputId="cp-confirmPassword"
        [required]="true"
        [error]="confirmPasswordError()">
        <input
          id="cp-confirmPassword"
          type="password"
          name="confirmPassword"
          autocomplete="new-password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
        />
      </app-form-field>

      @if (errorKey()) {
        <p class="cp-error">{{ errorKey() | transloco }}</p>
      }

      <button type="submit" class="cp-submit-btn" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent" class="cp-submit-btn__spinner"></ion-spinner>
        }
        {{ 'auth.changePassword.submit' | transloco }}
      </button>

      @if (!forced()) {
        <button type="button" class="cp-cancel-btn" (click)="cancel()">
          {{ 'common.cancel' | transloco }}
        </button>
      }
    </form>

  </div>
</div>
