<section class="party" [formGroup]="group">

  <header class="party__head">
    <span class="party__icon">
      <ion-icon [name]="isCompany ? 'business-outline' : 'person-outline'"></ion-icon>
    </span>
    <div>
      <h3 class="party__title">{{ title }}</h3>
      @if (hint) {
        <p class="party__hint">{{ hint }}</p>
      }
    </div>
  </header>

  <!-- A company fills a trading name, a CIF and a legal representative in
       place of a personal name, ID document and CNP. -->
  <label class="checkbox-row">
    <input type="checkbox" class="checkbox-input" formControlName="is_company" />
    <span class="checkbox-label">{{ 'saleContract.wizard.party.isCompany' | transloco }}</span>
  </label>
  @if (isCompany) {
    <p class="party__hint party__hint--inline">{{ 'saleContract.wizard.party.companyHint' | transloco }}</p>
  }

  <div class="two-col-row">
    <app-form-field [label]="nameLabelKey | transloco" [placeholder]="isCompany ? '' : ('saleContract.placeholders.fullName' | transloco)" formControlName="full_name"></app-form-field>
    <app-form-field [label]="idNumberLabelKey | transloco" [placeholder]="isCompany ? '' : ('saleContract.placeholders.cnp' | transloco)" inputmode="numeric" formControlName="cnp_or_cif"></app-form-field>
  </div>

  @if (!isCompany) {
    <div class="two-col-row">
      <app-form-field [label]="'saleContract.fields.idSeries' | transloco" [placeholder]="'saleContract.placeholders.idSeries' | transloco" formControlName="id_series"></app-form-field>
      <app-form-field [label]="'saleContract.fields.idNumber' | transloco" [placeholder]="'saleContract.placeholders.idNumber' | transloco" formControlName="id_number"></app-form-field>
    </div>
  }

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.phone' | transloco" inputmode="tel" formControlName="phone"></app-form-field>
    <app-form-field [label]="'saleContract.fields.email' | transloco" [inputType]="InputType.Email" formControlName="email"></app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.capacity' | transloco" [placeholder]="'saleContract.placeholders.capacity' | transloco" formControlName="capacity"></app-form-field>
  </div>

  <!-- ── Legal representative (companies only) ───────────────────────── -->
  @if (isCompany) {
    <div class="party__sub" formGroupName="representative">
      <h4 class="party__sub-title">{{ 'saleContract.fields.representative' | transloco }}</h4>
      <div class="two-col-row">
        <app-form-field [label]="'saleContract.fields.fullName' | transloco" formControlName="full_name"></app-form-field>
        <app-form-field [label]="'saleContract.fields.cnp' | transloco" inputmode="numeric" formControlName="cif"></app-form-field>
      </div>
      <div class="two-col-row">
        <app-form-field [label]="'saleContract.fields.idSeries' | transloco" formControlName="id_series"></app-form-field>
        <app-form-field [label]="'saleContract.fields.idNumber' | transloco" formControlName="id_number"></app-form-field>
      </div>
    </div>
  }

  <!-- ── Address ─────────────────────────────────────────────────────── -->
  <div class="party__sub">
    <h4 class="party__sub-title">{{ 'saleContract.fields.address' | transloco }}</h4>
    <app-contract-address-form [group]="addressGroup" [idPrefix]="idPrefix + '-addr'" />
  </div>

  <!-- ── Fiscal domicile — collapsed, most people never need it ──────── -->
  <div class="party__collapsible" [class.is-open]="fiscalOpen">
    <button type="button" class="party__collapsible-toggle" (click)="toggleFiscal()"
            [attr.aria-expanded]="fiscalOpen">
      <span>{{ 'saleContract.fields.fiscalAddress' | transloco }}</span>
      <ion-icon name="chevron-down-outline" class="party__chevron"></ion-icon>
    </button>
    @if (fiscalOpen) {
      <div class="party__collapsible-body">
        <app-contract-address-form [group]="fiscalAddressGroup" [idPrefix]="idPrefix + '-fiscal'" />
      </div>
    }
  </div>

</section>
