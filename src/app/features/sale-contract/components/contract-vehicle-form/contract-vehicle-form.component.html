<div class="vehicle-form" [formGroup]="group">

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.make' | transloco" [placeholder]="'saleContract.placeholders.make' | transloco" formControlName="make"></app-form-field>
    <app-form-field [label]="'saleContract.fields.type' | transloco" formControlName="type"></app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.vin' | transloco" variant="mono" [placeholder]="'saleContract.placeholders.vin' | transloco" formControlName="vin"></app-form-field>
    <app-form-field [label]="'saleContract.fields.licensePlate' | transloco" format="licensePlate"
                    [placeholder]="'saleContract.placeholders.licensePlate' | transloco"
                    formControlName="license_plate"></app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.engineSeries' | transloco" formControlName="engine_series"></app-form-field>
    <app-form-field [label]="'saleContract.fields.engineCapacity' | transloco" [inputType]="InputType.Number"
                    inputmode="numeric" [min]="0" formControlName="engine_capacity_cm3"></app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.maxWeight' | transloco" [control]="group.controls['max_weight_tons']">
      <input type="number" min="0" step="0.001" formControlName="max_weight_tons" />
    </app-form-field>
    <app-form-field [label]="'saleContract.fields.manufactureYear' | transloco" [control]="group.controls['manufacture_year']">
      <input type="text" maxlength="4" formControlName="manufacture_year" appYearInput />
    </app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.civNumber' | transloco" formControlName="civ_number"></app-form-field>
    <app-form-field [label]="'saleContract.fields.euroNorm' | transloco" formControlName="euro_norm"></app-form-field>
  </div>

  <div class="two-col-row">
    <app-form-field [label]="'saleContract.fields.itpExpiry' | transloco" [inputType]="InputType.Date"
                    formControlName="itp_expiry_date"></app-form-field>
    <app-form-field [label]="'saleContract.fields.acquiredDate' | transloco" [inputType]="InputType.Date"
                    formControlName="acquired_date"></app-form-field>
  </div>

  <app-form-field [label]="'saleContract.fields.acquiredDocument' | transloco"
                  formControlName="acquired_document"></app-form-field>

</div>
