<div class="address-grid" [formGroup]="group">

  <app-form-field [label]="'saleContract.fields.country' | transloco" formControlName="country"></app-form-field>
  <app-form-field [label]="'saleContract.fields.county' | transloco" formControlName="county"></app-form-field>
  <app-form-field [label]="'saleContract.fields.postalCode' | transloco" formControlName="postal_code" inputmode="numeric"></app-form-field>
  <app-form-field class="address-grid__wide" [label]="'saleContract.fields.city' | transloco" formControlName="city"></app-form-field>
  <app-form-field [label]="'saleContract.fields.villageOrSector' | transloco" formControlName="village_or_sector"></app-form-field>
  <app-form-field class="address-grid__wide" [label]="'saleContract.fields.street' | transloco" formControlName="street"></app-form-field>

  <div class="address-grid__blanks">
    <app-form-field [label]="'saleContract.fields.streetNumber' | transloco" formControlName="street_number"></app-form-field>
    <app-form-field [label]="'saleContract.fields.building' | transloco" formControlName="building"></app-form-field>
    <app-form-field [label]="'saleContract.fields.staircase' | transloco" formControlName="staircase"></app-form-field>
    <app-form-field [label]="'saleContract.fields.floor' | transloco" formControlName="floor"></app-form-field>
    <app-form-field [label]="'saleContract.fields.apartment' | transloco" formControlName="apartment"></app-form-field>
  </div>

</div>
