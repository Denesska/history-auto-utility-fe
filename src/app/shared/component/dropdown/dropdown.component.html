<div class="dd-wrap" [class.dd-wrap--full]="fullWidth">

  <!-- Mobile: native OS picker, styled to match the app's pill trigger -->
  <div class="dd-native-wrap" [class.dd-native-wrap--disabled]="disabled" [class.dd-native-wrap--error]="error">
    <select
      [id]="id || null"
      class="dd-native"
      [value]="value"
      (change)="onNativeChange($event)"
      [disabled]="disabled"
      [attr.aria-label]="ariaLabel || null">
      @for (opt of options; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <ion-icon name="chevron-down-outline" class="dd-chevron dd-chevron--native"></ion-icon>
  </div>

  <!-- Desktop: custom themed dropdown panel -->
  <button
    [id]="id || null"
    type="button"
    class="dd-trigger"
    [class.dd-trigger--open]="open"
    [class.dd-trigger--disabled]="disabled"
    [class.dd-trigger--error]="error"
    [disabled]="disabled"
    (click)="toggle()"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-expanded]="open">
    @if (leadingIcon) {
      <ion-icon [name]="leadingIcon" class="dd-leading-icon"></ion-icon>
    }
    <span class="dd-trigger-label">{{ selectedLabel }}</span>
    <ion-icon name="chevron-down-outline" class="dd-chevron" [class.dd-chevron--open]="open"></ion-icon>
  </button>
  @if (open) {
    <ul class="dd-panel" [class.dd-panel--right]="align === 'right'">
      @for (opt of options; track opt.value) {
        <li class="dd-option" [class.dd-option--selected]="opt.value === value" (click)="select(opt)">
          {{ opt.label }}
        </li>
      }
    </ul>
  }
</div>
