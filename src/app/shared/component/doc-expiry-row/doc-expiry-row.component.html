<div class="activity-row exp-row" (click)="rowClick.emit()">
  <app-doc-type-badge [docType]="docType"></app-doc-type-badge>
  <div class="activity-info">
    <span class="activity-desc">
      {{ title }}
      @if (isActive === true) {
        <ion-icon name="checkmark-circle" class="active-badge" [attr.title]="'documents.activeBadge' | transloco"></ion-icon>
      }
    </span>
    <span class="activity-car">{{ carLabel }}@if (licensePlate) { · {{ licensePlate }} }</span>
    @if (progressPercent !== null) {
      <div class="hau-progress exp-row-progress" [class.hau-progress--warning]="urgencyClass === 'warning'" [class.hau-progress--danger]="urgencyClass === 'expired' || urgencyClass === 'critical'">
        <div class="hau-progress-fill" [style.width.%]="progressPercent"></div>
      </div>
    }
  </div>
  <div class="activity-time">
    @if (days !== null) {
      <span [class]="'activity-date ' + (days === 0 ? 'hau-days-zero' : urgencyClass)">
        @if (days < 0) { {{ 'overview.expiring.expired' | transloco }} }
        @else { {{ days }}d }
      </span>
    }
    <span class="activity-clock">{{ dateStr }}</span>
    @if (ctaStyle !== 'none') {
      <button type="button" class="exp-row-cta exp-row-cta--{{ ctaStyle }}" (click)="$event.stopPropagation(); ctaClick.emit()">
        {{ ctaLabel }}
      </button>
    }
  </div>
</div>
