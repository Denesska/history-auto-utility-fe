<div class="cov" [class.cov--warning]="state === 'warning'" [class.cov--danger]="state === 'overdue'">
  <span class="cov-chip">
    <ion-icon name="link-outline"></ion-icon>
    {{ 'documents.detail.coverage.chip' | transloco: { count: docCount } }}
  </span>
  <div class="cov-track" role="progressbar"
       [attr.aria-valuenow]="progressPercent ?? 0" aria-valuemin="0" aria-valuemax="100">
    @for (seg of segments; track $index) {
      <span class="cov-seg" [class.cov-seg--next]="$index > 0"
            [style.left.%]="seg.startPct" [style.width.%]="seg.endPct - seg.startPct">
        <span class="cov-fill" [style.width.%]="fillPct(seg)"></span>
      </span>
    }
  </div>
  @if (!compact && nextStart) {
    <span class="cov-caption">
      {{ 'documents.detail.coverage.temporary' | transloco: { date: (nextStart | localDate:'d MMM y') } }}
    </span>
  }
</div>
